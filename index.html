<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Management System</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container main-container">
    <!-- Header Section -->
    <header class="header">
      <h1>Device Management System</h1>
      <p>Manage and control your IoT devices with video preview and voice intercom</p>
      <div id="connection-status" class="connection-status disconnected">Disconnected</div>
    </header>

    <!-- Device List Section -->
    <section class="device-section">
      <h2>Connected Devices</h2>
      <div id="device-list" class="row">
        <!-- Device items will be dynamically added here -->
        <div class="col-12">
          <div class="alert alert-info text-center">
            No devices found. Waiting for device registration...
          </div>
        </div>
      </div>
    </section>

    <!-- Video Preview Section -->
    <section class="video-section">
      <h2>Video Preview</h2>
      <div id="video-preview-container" class="position-relative">
        <!-- Video element will be dynamically added here -->
        <div class="empty-state">
          <i class="bi bi-camera-video"></i>
        </div>
      </div>
    </section>
  </div>

  <!-- Bootstrap JS Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- MQTT.js library -->
  <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
  <!-- Application modules -->
  <script src="js/config.js"></script>
  <script src="js/device.js"></script>
  <script src="js/mqtt-client.js"></script>
  <script src="js/webrtc-handler.js"></script>
  <script src="js/ui-manager.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
